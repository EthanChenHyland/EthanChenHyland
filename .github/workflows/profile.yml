name: Refresh profile

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'profile.json'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install -r requirements.txt
      - name: Test calculations and image conversion
        run: python -m unittest discover -s tests -v
      - name: Generate activity graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_profile.py
      - name: Reconstruct source image when present
        run: |
          if [ -f assets/source/hero.png ]; then
            python scripts/make_ascii.py assets/source/hero.png
          fi
      - name: Validate SVGs and README
        run: python scripts/validate.py
      - name: Commit changed generated output
        run: |
          git add -- generated/ README.md
          if git diff --cached --quiet; then
            echo 'Generated output is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile graphics'
          git push
